[project]
name = "stay-assistant"
version = "0.1.0"
description = "Stay Assistant agent running on MongoDB Atlas Agent Engine"
requires-python = ">=3.11"
dependencies = [
    "agent-engine-runner-shared",
    "agent-engine-sdk-langgraph",
    "langchain-openai",
    "langgraph",
    "pymongo",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
